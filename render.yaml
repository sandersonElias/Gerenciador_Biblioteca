previews:
  generation: off

services:
  - type: web
    name: biblioteca-monsa-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./Back-End
    dockerfilePath: ./Back-End/Dockerfile
    healthCheckPath: /livro/populares
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-monsa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: SHOW_SQL
        value: "false"
      - key: EMAIL_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://biblioteca-monsa.vercel.app,https://biblioteca-monsa-sanderson-elias-projects.vercel.app,http://localhost:5173
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0

databases:
  - name: biblioteca-monsa-db
    databaseName: gerenciador_biblioteca
    user: biblioteca
    plan: free
    region: virginia
    postgresMajorVersion: "16"
