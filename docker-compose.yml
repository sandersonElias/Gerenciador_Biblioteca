services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gerenciador_biblioteca}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha123}
    ports:
      - "5432:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gerenciador_biblioteca}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Back-End
    container_name: biblioteca-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gerenciador_biblioteca}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-senha123}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-min-32-characters-long}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SHOW_SQL: ${SHOW_SQL:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@biblioteca-demo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Front-End
    container_name: biblioteca-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  biblioteca_pgdata:
